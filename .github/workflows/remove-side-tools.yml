name: remove-side-tools

on:
  workflow_dispatch:
  push:
    branches: [chore/remove-side-tools]
    paths:
      - .github/workflows/remove-side-tools.yml

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-side-tools
      - name: Remove non-finance tools
        run: |
          set -euo pipefail
          keep="vat-split income-tax payroll quote number-chinese"
          for d in tools/*; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            case " $keep " in
              *" $name "*) ;;
              *) rm -rf "$d" ;;
            esac
          done
          rm -rf supabase/functions/douyin-parser
          rm -f .github/workflows/remove-side-tools.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: remove non-finance utility tools"
          git push origin HEAD:chore/remove-side-tools
