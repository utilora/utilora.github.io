name: 页面检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查页面与工具入口
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 必要文件存在
        run: |
          set -euo pipefail
          for f in \
            index.html \
            README.md \
            assets/css/site.css \
            assets/css/finance-home.css \
            assets/js/app.js \
            feedback/index.html \
            robots.txt \
            sitemap.xml
          do
            test -f "$f" || { echo "缺少文件: $f"; exit 1; }
          done
          echo "核心文件齐全"

      - name: 工具目录完整
        run: |
          set -euo pipefail
          missing=0
          count=0
          for dir in tools/*/; do
            [ -d "$dir" ] || continue
            count=$((count + 1))
            name=$(basename "$dir")
            if [ ! -f "${dir}index.html" ]; then
              echo "缺少 ${name}/index.html"
              missing=1
            fi
            if [ ! -f "${dir}tool.js" ]; then
              echo "缺少 ${name}/tool.js"
              missing=1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "tools/ 下没有工具目录"
            exit 1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "保留工具页文件齐全: ${count} 个"

      - name: 首页财务卡片链接有效
        run: |
          set -euo pipefail
          python3 << 'PY'
          import re
          import pathlib
          import sys

          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          cards = re.findall(
              r'<a class="finance-tool-card[^"]*" href="(tools/[^"]+/)"',
              html,
          )
          if not cards:
              print("首页没有找到财务工具卡片")
              sys.exit(1)

          failed = False
          seen = set()
          for href in cards:
              path = pathlib.Path(href) / "index.html"
              if href in seen:
                  print(f"重复财务卡片: {href}")
                  failed = True
              seen.add(href)
              if not path.is_file():
                  print(f"死链: {href} -> 缺少 {path}")
                  failed = True
              else:
                  print(f"OK  {href}")

          generic_markers = (
              "JSON 格式化",
              "图片压缩",
              "正则测试",
              "UUID 生成器",
          )
          leaked = [name for name in generic_markers if name in html]
          if leaked:
              print("首页仍显示非财务工具: " + ", ".join(leaked))
              failed = True

          print(f"共检查 {len(cards)} 个公开财务工具入口")
          sys.exit(1 if failed else 0)
          PY

      - name: 本地财务台与 CSV 回归检查
        run: |
          set -euo pipefail
          node --check pro/app.js
          node --check tools/vat-split/tool.js
          node --check assets/js/app.js
          python3 << 'PY'
          import pathlib

          home = pathlib.Path("index.html").read_text(encoding="utf-8")
          workbench = pathlib.Path("pro/app.js").read_text(encoding="utf-8")
          vat = pathlib.Path("tools/vat-split/tool.js").read_text(encoding="utf-8")

          assert 'data-login' not in home, "首页仍有登录入口"
          assert "本地财务台 Beta" in home and "不跟随账号" in home
          for token in ("indexedDB.open", "STORE_WORKSPACES", "STORE_RECOVERY", "导出完整备份", "导入备份", "清空当前公司数据", "载入演示数据", "应收账龄"):
              assert token in workbench, f"本地财务台缺少: {token}"
          assert "csvCell" in vat and "\\uFEFF" in vat and "\\r\\n" in vat, "CSV 转义或 Excel 兼容处理缺失"
          print("本地财务台与 CSV 回归检查通过")
          PY

      - name: 财务计算单元测试
        run: node tests/finance.test.js
