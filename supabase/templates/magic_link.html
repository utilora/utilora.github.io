<!doctype html>
<html lang="zh-CN">
<body style="margin:0;background:#f4f7f9;font-family:Arial,'Microsoft YaHei',sans-serif;color:#172033">
  <div style="max-width:520px;margin:32px auto;padding:32px;background:#fff;border-radius:16px">
    <h1 style="margin:0 0 12px;font-size:24px">你的 Utilora 验证码</h1>
    <p style="line-height:1.7;color:#667085">请输入下面的验证码完成邮箱验证。不要把验证码发给任何人。</p>
    <div style="margin:24px 0;padding:18px;text-align:center;background:#eef8f5;border-radius:12px;font-size:34px;font-weight:800;letter-spacing:8px;color:#08705b">{{ .Token }}</div>
    <p style="line-height:1.7;color:#667085">验证码有效期有限。如果不是你本人操作，请忽略本邮件。</p>
  </div>
</body>
</html>
