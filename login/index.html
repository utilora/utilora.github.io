<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="turnstile-site-key" content="">
  <title>登录 - Utilora</title>
  <meta name="description" content="使用邮箱登录 Utilora。注册会向真实邮箱发送验证码，验证成功后才能登录。">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <a class="brand" href="../"><span class="brand-mark">U</span><span>返回工具箱</span></a>
      <h1 id="title">登录</h1>
      <p class="hint" id="lead">工具不用登录也能用。注册会向真实邮箱发送验证码，验证成功后才能登录。</p>
      <p id="banner" class="message" role="status"></p>
      <form id="auth-form">
        <div class="field" id="name-field" hidden>
          <label for="name">称呼</label>
          <div class="name-row">
            <input id="name" autocomplete="nickname" placeholder="例如：林深">
            <button id="random-name" class="secondary" type="button">随机</button>
          </div>
        </div>
        <div class="field">
          <label for="email">邮箱</label>
          <input id="email" type="email" required autocomplete="username" inputmode="email">
        </div>
        <div class="field" id="password-field">
          <label for="password">密码</label>
          <input id="password" type="password" required minlength="8" autocomplete="current-password">
          <p id="strength" class="hint tight" hidden></p>
        </div>
        <div class="field" id="confirm-field" hidden>
          <label for="confirm">确认密码</label>
          <input id="confirm" type="password" minlength="8" autocomplete="new-password">
        </div>
        <div class="field" id="otp-field" hidden>
          <label for="otp">邮箱验证码</label>
          <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{6,8}" placeholder="请输入邮件中的验证码">
          <p class="hint tight">验证码为 6 到 8 位数字，请按邮件里的完整数字填写。</p>
        </div>
        <div id="turnstile-slot" class="field" hidden></div>
        <button id="submit" type="submit">登录</button>
      </form>
      <p id="form-msg" class="message" role="status"></p>
      <div class="login-links">
        <button id="toggle-mode" class="text-link" type="button">没有账号？注册</button>
        <button id="toggle-recover" class="text-link" type="button">忘记密码</button>
        <button id="resend" class="text-link" type="button" hidden>重新发送验证邮件</button>
      </div>
    </div>
  </main>
  <script src="../assets/js/auth.js?v=19"></script>
  <script src="../assets/js/analytics.js"></script>
  <script>
    (function () {
      var meta = document.querySelector('meta[name="turnstile-site-key"]');
      var siteKey = (window.__TURNSTILE_SITE_KEY || (meta && meta.content) || "").trim();
      if (!siteKey) return;
      var slot = document.getElementById("turnstile-slot");
      if (slot) slot.hidden = false;
      window.__onTurnstile = function (token) { window.__turnstileToken = token; };
      var s = document.createElement("script");
      s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
      s.async = true;
      s.onload = function () {
        if (!window.turnstile || !slot) return;
        window.turnstile.render(slot, {
          sitekey: siteKey,
          callback: window.__onTurnstile,
          "error-callback": function () { window.__turnstileToken = ""; },
          "expired-callback": function () { window.__turnstileToken = ""; }
        });
      };
      document.head.appendChild(s);
    })();
  </script>
  <script src="login.js?v=19"></script>

</body>
</html>
