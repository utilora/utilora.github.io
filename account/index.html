<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>账号 - Utilora</title>
  <meta name="description" content="查看 Utilora 方案、到期日，并进入本地财务备份。">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../assets/css/site.css">
  <style>
    #plan-stats{grid-template-columns:repeat(3,minmax(0,1fr));margin:0 0 14px}
    #plan-stats .stat{text-align:left}
    #plan-stats .stat span{display:block;margin-bottom:6px;color:var(--muted);font-size:12px;font-weight:750}
    #plan-stats .stat strong{font-size:18px;color:var(--ink)}
    #plan-backup.secondary{color:#334155;background:#e8eef7}
    @media(max-width:650px){#plan-stats{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="tool-head">
    <nav>
      <a class="brand" href="../">Utilora</a>
      <a class="login-link" data-login="1" href="../account/">账号</a>
    </nav>
  </header>
  <main class="tool-main account-main">
    <section class="panel">
      <div class="account-hero">
        <span class="account-avatar" id="avatar">U</span>
        <div>
          <h1 id="hello">账号</h1>
          <p class="hint" id="email-line"></p>
          <p id="verify-badge"></p>
          <p id="plan-badge" class="plan-pill">读取中</p>
        </div>
      </div>
      <form id="profile-form">
        <div class="field">
          <label for="name">称呼</label>
          <input id="name" autocomplete="nickname">
        </div>
        <div class="field">
          <label for="email">邮箱</label>
          <input id="email" type="email" readonly>
        </div>
        <button type="submit">保存资料</button>
      </form>
      <p id="profile-msg" class="message" role="status"></p>
    </section>
    <section class="panel" id="plan-panel">
      <h2>当前权益</h2>
      <div class="stats" id="plan-stats">
        <div class="stat"><span>方案</span><strong id="plan-name">读取中</strong></div>
        <div class="stat"><span>到期日</span><strong id="plan-expiry">读取中</strong></div>
        <div class="stat"><span>工作台</span><strong id="plan-access">读取中</strong></div>
      </div>
      <p class="hint" id="plan-copy">正在读取你的方案与到期日。</p>
      <p class="hint tight">财务数据只保存在当前浏览器，不跟随账号。到期后仍可查看和完整导出。</p>
      <div class="actions">
        <a class="download-button" id="plan-workspace" href="../pro/">打开财务工作台</a>
        <a class="download-button secondary" id="plan-backup" href="../pro/#/settings">导出完整备份</a>
      </div>
    </section>
    <section class="panel">
      <h2>我的收藏</h2>
      <div id="favs" class="account-chips"></div>
      <p id="fav-empty" class="hint">还没有收藏。打开工具后点星标即可。</p>
    </section>
    <section class="panel">
      <h2>最近使用</h2>
      <div id="recents" class="account-chips"></div>
      <p id="recent-empty" class="hint">还没有使用记录。</p>
    </section>
    <div class="actions">
      <a class="download-button" href="../">返回工具箱</a>
      <button id="logout" class="secondary" type="button">退出登录</button>
    </div>
  </main>
  <script src="../assets/js/auth.js?v=19"></script>
  <script src="../assets/js/announcement.js"></script>
  <script src="../assets/js/app.js?v=14"></script>
  <script src="../assets/js/pro.js?v=2"></script>
  <script src="account.js?v=4"></script>
  <script type="module" src="/src/account.ts"></script>
</body>
</html>
